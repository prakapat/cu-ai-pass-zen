services:
  mysql:
    image: mysql:8
    container_name: cuaipass-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - '3306:3306'
    volumes:
      - cuaipass_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u${MYSQL_USER}', '-p${MYSQL_PASSWORD}']
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    container_name: cuaipass-adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      - mysql

volumes:
  cuaipass_mysql_data:
